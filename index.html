<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待办清单 · Todo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>我的待办</h1>
      <p class="sub" id="today"></p>
    </header>

    <form class="add-form" id="add-form">
      <input
        type="text"
        id="task-input"
        placeholder="输入一个任务，回车添加"
        autocomplete="off"
        maxlength="80"
      >
      <button type="submit" class="btn primary">添加</button>
    </form>

    <div class="filters" id="filters">
      <button data-filter="all" class="active">全部</button>
      <button data-filter="active">未完成</button>
      <button data-filter="done">已完成</button>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <footer class="footer">
      <span id="counter">0 项任务</span>
      <button class="btn" id="clear-done">清除已完成</button>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
